<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Privacy KPI Cards — Split-Flap Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg-1:#0b0d10;
    --page-bg-2:#15181c;
    --frame-1:#2a2d32;
    --frame-2:#1b1d21;
    --flap-bg:#17181b;
    --flap-bg-2:#101113;
    --seam:rgba(0,0,0,.55);
    --seam-hi:rgba(255,255,255,.05);
    --letter:#ece6d8;
    --muted:#8b909a;
    --divider:#3a3e44;
    --green:#6fcf97;
    --gold:#f2b807;
    --coral:#ff7a59;
    --grey:#7d8590;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c2027 0%, transparent 60%),
      linear-gradient(160deg,var(--page-bg-1),var(--page-bg-2));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:'Inter',sans-serif;
  }

  .stage{
    width:100%;
    max-width:1160px;
    overflow-x:auto;
    padding-bottom:4px;
  }

  .board-frame{
    position:relative;
    background:linear-gradient(180deg,var(--frame-1),var(--frame-2));
    border-radius:16px;
    padding:34px 36px 26px;
    min-width:1040px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -1px 0 rgba(0,0,0,.4);
    border:1px solid #05060700;
  }

  .board-frame::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:10px;
    pointer-events:none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  }

  .hero-wrap{ display:flex; justify-content:center; margin-bottom:18px; }
  .sub-wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
    padding-bottom:18px;
    border-bottom:1px solid var(--divider);
  }
  .sub-flap{ display:flex; }

  .clock{
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.04em;
  }
  .clock span{ color:#c7cad0; font-weight:600; }

  .table-head{
    display:grid;
    grid-template-columns: var(--w-metric) var(--w-votes) var(--w-score) var(--w-status);
    column-gap:28px;
    padding:0 2px 10px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.14em;
    font-weight:600;
  }

  .rows{ display:flex; flex-direction:column; gap:10px; }

  .row{
    display:grid;
    grid-template-columns: var(--w-metric) var(--w-votes) var(--w-score) var(--w-status);
    column-gap:28px;
    align-items:center;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .45s ease, transform .45s ease;
    padding:6px 2px;
    border-radius:8px;
  }
  .row.visible{ opacity:1; transform:translateY(0); }

  .flap-group{ display:flex; gap:2px; }
  .flap-group.status .face{ font-weight:800; }

  .status-cell{ display:flex; align-items:center; gap:8px; }
  .status-chip .face{ border-radius:2px; }

  .flap{
    position:relative;
    perspective:240px;
    border-radius:3px;
    background:linear-gradient(180deg,#202226,#141518);
    box-shadow:0 1px 0 rgba(255,255,255,.04), 0 2px 4px rgba(0,0,0,.4);
  }
  .flap-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform 85ms linear;
  }
  .flap-inner.flip{ transform:rotateX(-180deg); }
  .face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    font-family:'Big Shoulders Display',sans-serif;
    color:var(--letter);
    font-weight:700;
    line-height:1;
  }
  .face.front{ transform:rotateX(0deg); }
  .face.back{ transform:rotateX(180deg); }
  .flap-seam{
    position:absolute; left:0; right:0; top:50%; height:1px;
    background:var(--seam);
    box-shadow:0 1px 0 var(--seam-hi);
    z-index:4;
    pointer-events:none;
  }

  .status-ON.TIME, .status-on-time{ color:var(--green); }
  .col-status .flap-group.color-green .face{ color:var(--green); }
  .col-status .flap-group.color-gold .face{ color:var(--gold); }
  .col-status .flap-group.color-coral .face{ color:var(--coral); }
  .col-status .flap-group.color-grey .face{ color:var(--grey); }

  .nameplate{
    margin-top:24px;
    padding-top:16px;
    border-top:1px solid var(--divider);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--muted);
  }

  .nameplate-actions{ display:flex; align-items:center; gap:8px; }

  .replay-btn{
    appearance:none;
    border:1px solid var(--divider);
    background:linear-gradient(180deg,#24262b,#1a1c20);
    color:#c7cad0;
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:.1em;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .replay-btn:hover{ background:linear-gradient(180deg,#2b2e33,#1e2024); }
  .replay-btn:active{ transform:translateY(1px); }
  .replay-btn:focus-visible{ outline:2px solid #6fcf97; outline-offset:2px; }

  .upload-btn{
    appearance:none;
    border:1px solid var(--divider);
    background:linear-gradient(180deg,#212226,#191a1d);
    color:#c0c3c9;
    width:46px;
    height:31px;
    padding:0;
    border-radius:5px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .upload-btn svg{ width:14px; height:16px; display:block; }
  .upload-btn:hover{ background:linear-gradient(180deg,#3a3c44,#191a1d); }
  .upload-btn:active{ transform:translateY(1px); }
  .upload-btn:focus-visible{ outline:2px solid #6fcf97; outline-offset:2px; }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(5,6,7,.72);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    padding:16px;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }

  .upload-modal{
    position:relative;
    width:412px;
    max-width:100%;
    background:linear-gradient(180deg,#26282c,#1a1b1e);
    border-radius:13px;
    padding:17px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.06);
    transform:translateY(8px);
    transition:transform .2s ease;
  }
  .modal-overlay.open .upload-modal{ transform:translateY(0); }

  .modal-close{
    appearance:none; border:none; background:none;
    position:absolute; top:10px; right:12px;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:18px; line-height:1;
    cursor:pointer;
    padding:4px;
  }
  .modal-close:hover{ color:#c7cad0; }
  .modal-close:focus-visible{ outline:2px solid #6fcf97; outline-offset:2px; }

  .upload-modal-panel{
    border:1px solid #18191c;
    border-radius:7px;
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .upload-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .upload-row-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:18px;
    color:var(--muted);
    letter-spacing:.02em;
    transition:color .2s ease;
  }
  .upload-row.active .upload-row-label{ color:#c0c3c9; }
  .upload-row.done .upload-row-label{ color:#c0c3c9; }
  .upload-row.error .upload-row-label{ color:var(--coral); }

  .flap-group.pct .flap{ width:22px; height:33px; }
  .flap-group.pct .face{ font-size:20px; font-family:'IBM Plex Sans Condensed','Inter',sans-serif; }
  .flap-group.pct.pct-error .face{ color:var(--coral); }

  .upload-modal-message{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--coral);
    text-align:center;
    min-height:16px;
    margin-top:-4px;
  }

  .modal-continue-btn{
    appearance:none;
    align-self:center;
    margin-top:6px;
    border:1px solid var(--divider);
    background:linear-gradient(180deg,#212226,#191a1d);
    color:#c0c3c9;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    letter-spacing:.04em;
    padding:11px 20px;
    border-radius:5px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .modal-continue-btn:hover:not(:disabled){ background:linear-gradient(180deg,#2b2d33,#1e2024); }
  .modal-continue-btn:active:not(:disabled){ transform:translateY(1px); }
  .modal-continue-btn:focus-visible{ outline:2px solid #6fcf97; outline-offset:2px; }
  .modal-continue-btn:disabled{ opacity:.35; cursor:not-allowed; }

  @media (prefers-reduced-motion: reduce){
    .flap-inner{ transition:none; }
    .row{ transition:none; }
    .modal-overlay, .upload-modal{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="board-frame"
       style="--w-metric:576px; --w-votes:78px; --w-score:104px; --w-status:260px;">

    <div class="hero-wrap" id="hero"></div>

    <div class="sub-wrap">
      <div class="sub-flap" id="sub"></div>
      <div class="clock" id="clock">--:--:-- <span id="clock-period"></span></div>
    </div>

    <div class="table-head">
      <span>METRIC</span>
      <span>VOTES</span>
      <span>SCORE</span>
      <span>STATUS</span>
    </div>

    <div class="rows" id="rows"></div>

    <div class="nameplate">
      <span>MODEL SF·24 &nbsp;·&nbsp; SOURCE: MAZE REPORT &nbsp;·&nbsp; N = 2 RESPONDENTS</span>
      <div class="nameplate-actions">
        <button class="upload-btn" id="upload" type="button" aria-label="Upload a MAZE report PDF" title="Upload a MAZE report PDF">
          <svg viewBox="16 7 14 16" fill="currentColor" aria-hidden="true">
            <path d="M23.5 9.71875V18.5C23.5 18.7812 23.2812 19 23 19C22.7188 19 22.5 18.7812 22.5 18.5V9.71875L19.8438 12.3438C19.6562 12.5625 19.3438 12.5625 19.1562 12.3438C18.9688 12.1562 18.9688 11.8438 19.1562 11.6562L22.6562 8.15625C22.8438 7.9375 23.1562 7.9375 23.3438 8.15625L26.8438 11.6562C27.0625 11.8438 27.0625 12.1562 26.8438 12.3438C26.6562 12.5625 26.3438 12.5625 26.1562 12.3438L23.5 9.71875ZM21 18H18C17.4375 18 17 18.4375 17 19V21C17 21.5625 17.4375 22 18 22H28C28.5625 22 29 21.5625 29 21V19C29 18.4375 28.5625 18 28 18H25V17H28C29.0938 17 30 17.9062 30 19V21C30 22.0938 29.0938 23 28 23H18C16.9062 23 16 22.0938 16 21V19C16 17.9062 16.9062 17 18 17H21V18ZM26 20C26 19.5938 26.3438 19.25 26.75 19.25C27.1562 19.25 27.5 19.5938 27.5 20C27.5 20.4062 27.1562 20.75 26.75 20.75C26.3438 20.75 26 20.4062 26 20Z"/>
          </svg>
        </button>
        <input type="file" id="upload-input" accept="application/pdf" hidden>
        <button class="replay-btn" id="replay">REFRESH BOARD</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="upload-modal" role="dialog" aria-modal="true" aria-label="Upload a MAZE report PDF">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
    <div class="upload-modal-panel">
      <div class="upload-row" id="row-uploading">
        <span class="upload-row-label">UPLOADING</span>
        <div class="flap-group pct" id="pct-uploading"></div>
      </div>
      <div class="upload-row" id="row-verifying">
        <span class="upload-row-label">VERIFYING</span>
        <div class="flap-group pct" id="pct-verifying"></div>
      </div>
      <div class="upload-row" id="row-parsing">
        <span class="upload-row-label">PARSING DATA</span>
        <div class="flap-group pct" id="pct-parsing"></div>
      </div>
      <div class="upload-modal-message" id="modal-message"></div>
      <button class="modal-continue-btn" id="modal-continue" type="button" disabled>CONTINUE</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/%-";

const SIZES = {
  hero:  { w:40, h:56, fs:34 },
  sub:   { w:24, h:36, fs:20 },
  table: { w:22, h:32, fs:18 },
  pct:   { w:22, h:33, fs:20 },
  chip:  { w:18, h:32, fs:18 },
};

function buildFlapCell(size){
  const flap = document.createElement('div');
  flap.className = 'flap';
  flap.style.width = size.w + 'px';
  flap.style.height = size.h + 'px';

  const inner = document.createElement('div');
  inner.className = 'flap-inner';

  const front = document.createElement('div');
  front.className = 'face front';
  front.style.fontSize = size.fs + 'px';
  front.textContent = ' ';

  const back = document.createElement('div');
  back.className = 'face back';
  back.style.fontSize = size.fs + 'px';
  back.textContent = ' ';

  inner.appendChild(front);
  inner.appendChild(back);

  const seam = document.createElement('div');
  seam.className = 'flap-seam';

  flap.appendChild(inner);
  flap.appendChild(seam);

  flap._front = front;
  flap._back = back;
  flap._inner = inner;
  return flap;
}

// CSS transitions can occasionally fail to fire `transitionend` (a style
// recalc racing the class toggle, or the browser deciding to skip it) — since
// every flip step waits on that event, one dropped event stalls that flap's
// promise forever, and since reveals use Promise.all, one stuck cell blocks
// the entire board (or, for the modal, an entire progress readout)
// indefinitely. A fallback timer guarantees the flip always completes.
function onFlipEnd(inner, callback){
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    inner.removeEventListener('transitionend', onTransitionEnd);
    clearTimeout(fallback);
    callback();
  };
  const onTransitionEnd = () => finish();
  inner.addEventListener('transitionend', onTransitionEnd, { once:true });
  const fallback = setTimeout(finish, 160);
}

function spinFlap(flap, targetChar, opts={}){
  const idx = ALPHABET.indexOf(targetChar);
  const steps = opts.steps ?? (8 + Math.floor(Math.random()*7));
  const baseDelay = opts.baseDelay ?? 55;

  if (idx === -1) {
    flap._front.textContent = targetChar;
    return Promise.resolve();
  }

  const sequence = [];
  for (let i = steps; i >= 0; i--){
    const pos = ((idx - i) % ALPHABET.length + ALPHABET.length) % ALPHABET.length;
    sequence.push(ALPHABET[pos]);
  }

  return new Promise(resolve => {
    let i = 0;
    function step(){
      if (i >= sequence.length){ resolve(); return; }
      const nextChar = sequence[i];
      flap._back.textContent = nextChar;
      flap._inner.classList.add('flip');

      onFlipEnd(flap._inner, () => {
        flap._inner.style.transition = 'none';
        flap._inner.classList.remove('flip');
        flap._front.textContent = nextChar;
        void flap._inner.offsetWidth;
        flap._inner.style.transition = '';
        i++;
        const remaining = sequence.length - i;
        const delay = remaining < 3 ? baseDelay * 1.8 : baseDelay;
        setTimeout(step, delay);
      });
    }
    step();
  });
}

function buildFlapGroup(text, sizeKey, extraClass){
  const size = SIZES[sizeKey];
  const group = document.createElement('div');
  group.className = 'flap-group' + (extraClass ? ' ' + extraClass : '');
  const cells = [];
  for (const ch of text){
    const cell = buildFlapCell(size);
    group.appendChild(cell);
    cells.push(cell);
  }
  group._cells = cells;
  return group;
}

async function revealGroup(group, text, opts={}){
  const cells = group._cells;
  const jobs = [];
  for (let i = 0; i < cells.length; i++){
    const ch = text[i] ?? ' ';
    const delay = i * (opts.stagger ?? 22);
    jobs.push(new Promise(res => {
      setTimeout(() => { spinFlap(cells[i], ch, opts).then(res); }, delay);
    }));
  }
  await Promise.all(jobs);
}

function pad(str, width){
  return str.toUpperCase().padEnd(width, ' ').slice(0, width);
}

// Single-step flip used for rapidly-ticking counters (the modal's percent
// readouts), as opposed to spinFlap's multi-step spin used for the board reveal.
// Guards against overlapping calls: if a flip is already in flight when a new
// target character arrives, the in-flight flip's back face is updated in place
// and a follow-up flip is queued rather than starting a second, colliding
// transition on the same cell (which otherwise showed corrupted digits).
function setFlapChar(flap, ch){
  if (flap._pendingChar === ch || (!flap._flipping && flap._front.textContent === ch)) return;
  flap._pendingChar = ch;
  if (flap._flipping){
    flap._back.textContent = ch;
    return;
  }
  flap._flipping = true;
  flap._back.textContent = ch;
  flap._inner.classList.add('flip');
  onFlipEnd(flap._inner, () => {
    flap._inner.style.transition = 'none';
    flap._inner.classList.remove('flip');
    flap._front.textContent = flap._back.textContent;
    void flap._inner.offsetWidth;
    flap._inner.style.transition = '';
    flap._flipping = false;
    const next = flap._pendingChar;
    flap._pendingChar = null;
    if (next !== null && next !== flap._front.textContent) setFlapChar(flap, next);
  });
}

function pctText(n){
  const clamped = Math.max(0, Math.min(100, Math.round(n)));
  return String(clamped).padStart(3, ' ') + '%';
}

// Sets the readout directly (each changed digit still flips via setFlapChar).
// Deliberately NOT animated with requestAnimationFrame: rAF is throttled or
// fully suspended on a backgrounded tab, and this function is called from
// inside the upload/verify/parse pipeline — if progress display were awaited
// on an rAF loop, switching tabs mid-upload would hang the whole pipeline,
// not just the visual. The pipeline's real progress must never wait on how
// the browser feels like scheduling paint.
function setGroupPercent(group, n){
  const text = pctText(n);
  group._cells.forEach((cell, i) => setFlapChar(cell, text[i]));
}

const STATUS_COLOR = {
  'ON TIME':'color-green',
  'BOARDING':'color-gold',
  'DELAYED':'color-coral',
  'CANCELLED':'color-grey',
};

// Solid-color indicator chip appended after each row's STATUS text — a flap
// cell like the others, except its face is a flat fill instead of a letter.
const STATUS_CHIP_COLOR = {
  'ON TIME':'#028A02',
  'BOARDING':'#1470A9',
  'DELAYED':'#DA7C01',
  'CANCELLED':'#B30000',
};

function buildStatusChip(){
  const chip = buildFlapCell(SIZES.chip);
  chip.classList.add('status-chip');
  return chip;
}

// The full set of colors the chip cycles through — same order every time,
// so "cycle through all of the possible colors" always visits all four
// before settling, the same way spinFlap cycles the alphabet.
const CHIP_COLOR_SEQUENCE = ['#028A02', '#1470A9', '#DA7C01', '#B30000'];

function spinFlapColor(flap, targetColor, opts={}){
  const idx = CHIP_COLOR_SEQUENCE.indexOf(targetColor);
  const steps = opts.steps ?? (8 + Math.floor(Math.random()*7));
  const baseDelay = opts.baseDelay ?? 55;

  if (idx === -1){
    flap._front.style.backgroundColor = targetColor;
    return Promise.resolve();
  }

  const sequence = [];
  for (let i = steps; i >= 0; i--){
    const pos = ((idx - i) % CHIP_COLOR_SEQUENCE.length + CHIP_COLOR_SEQUENCE.length) % CHIP_COLOR_SEQUENCE.length;
    sequence.push(CHIP_COLOR_SEQUENCE[pos]);
  }

  return new Promise(resolve => {
    let i = 0;
    function step(){
      if (i >= sequence.length){ resolve(); return; }
      const nextColor = sequence[i];
      flap._back.style.backgroundColor = nextColor;
      flap._inner.classList.add('flip');
      onFlipEnd(flap._inner, () => {
        flap._inner.style.transition = 'none';
        flap._inner.classList.remove('flip');
        flap._front.style.backgroundColor = nextColor;
        void flap._inner.offsetWidth;
        flap._inner.style.transition = '';
        i++;
        const remaining = sequence.length - i;
        const delay = remaining < 3 ? baseDelay * 1.8 : baseDelay;
        setTimeout(step, delay);
      });
    }
    step();
  });
}

const DATA = [
  { metric:'ON-TIME COMPLETION',      votes:'2/2', score:'100%', status:'ON TIME'   },
  { metric:'CYCLE TIME BY STAGE',     votes:'1/2', score:'50%',  status:'BOARDING'  },
  { metric:'RESIDUAL RISK TREND',     votes:'1/2', score:'50%',  status:'BOARDING'  },
  { metric:'SETUP EASE',              votes:'1/1', score:'4/5',  status:'ON TIME'   },
  { metric:'USE FREQUENTLY',          votes:'1/1', score:'4/5',  status:'ON TIME'   },
  { metric:'TRUST FOR DECISIONS',     votes:'1/1', score:'4/5',  status:'ON TIME'   },
  { metric:'FOUND COMPLEX',           votes:'1/1', score:'4/5',  status:'DELAYED'   },
  { metric:'OPEN INSIGHTS CAPTURED',  votes:'0/3', score:'--',   status:'CANCELLED' },
];

const W_METRIC = 22, W_VOTES = 3, W_SCORE = 4, W_STATUS = 9;

const heroEl = document.getElementById('hero');
const subEl = document.getElementById('sub');
const rowsEl = document.getElementById('rows');

// The hero title comes from the uploaded report itself (see parseMazeReport's
// title extraction) and defaults to this project's own report until a file
// is uploaded. The sub-title is fixed — it names the board, not the report.
let HERO_TITLE = 'PRIVACY KPI CARDS';
const SUB_TITLE = 'MAZE STUDY';

let heroGroup = buildFlapGroup(HERO_TITLE, 'hero');
heroEl.appendChild(heroGroup);

const subGroup = buildFlapGroup(SUB_TITLE, 'sub');
subEl.appendChild(subGroup);

// Rebuilds the hero's flap cells to match a new title's length, so the
// title stays tightly centered (no trailing blank cells) regardless of how
// long the uploaded report's own title is.
function rebuildHeroGroup(text){
  heroEl.innerHTML = '';
  heroGroup = buildFlapGroup(' '.repeat(text.length), 'hero');
  heroEl.appendChild(heroGroup);
}

const rowEls = DATA.map(d => {
  const row = document.createElement('div');
  row.className = 'row';

  const metricGroup = buildFlapGroup(pad(d.metric, W_METRIC), 'table', 'metric');
  const votesGroup  = buildFlapGroup(pad(d.votes, W_VOTES), 'table', 'votes');
  const scoreGroup  = buildFlapGroup(pad(d.score, W_SCORE), 'table', 'score');
  const statusGroup = buildFlapGroup(pad(d.status, W_STATUS), 'table', 'status ' + (STATUS_COLOR[d.status] || ''));
  const chip = buildStatusChip();

  const statusCell = document.createElement('div');
  statusCell.className = 'status-cell';
  statusCell.appendChild(statusGroup);
  statusCell.appendChild(chip);

  row.appendChild(metricGroup);
  row.appendChild(votesGroup);
  row.appendChild(scoreGroup);
  row.appendChild(statusCell);

  rowsEl.appendChild(row);
  return { row, chip, groups: { metricGroup, votesGroup, scoreGroup, statusGroup } };
});

async function runSequence(){
  await revealGroup(heroGroup, HERO_TITLE, { stagger:26, baseDelay:60 });
  await new Promise(r => setTimeout(r, 150));
  await revealGroup(subGroup, SUB_TITLE, { stagger:18, baseDelay:50 });
  await new Promise(r => setTimeout(r, 200));

  for (let i = 0; i < DATA.length; i++){
    const { row, chip, groups } = rowEls[i];
    const d = DATA[i];
    row.classList.add('visible');
    await new Promise(r => setTimeout(r, 90));
    revealGroup(groups.metricGroup, pad(d.metric, W_METRIC), { stagger:12, baseDelay:34 });
    revealGroup(groups.votesGroup,  pad(d.votes, W_VOTES),  { stagger:12, baseDelay:34 });
    revealGroup(groups.scoreGroup,  pad(d.score, W_SCORE),  { stagger:12, baseDelay:34 });
    await revealGroup(groups.statusGroup, pad(d.status, W_STATUS), { stagger:12, baseDelay:34 });
    await spinFlapColor(chip, STATUS_CHIP_COLOR[d.status] || '#7d8590', { baseDelay:70 });
    await new Promise(r => setTimeout(r, 160));
  }
}

function tickClock(){
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const period = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clock').innerHTML =
    `${String(h).padStart(2,'0')}:${m}:${s} <span>${period}</span>`;
}
tickClock();
setInterval(tickClock, 1000);

async function resetBoard(){
  rowEls.forEach(({row}) => row.classList.remove('visible'));
  [heroGroup, subGroup, ...rowEls.flatMap(r => Object.values(r.groups))].forEach(g => {
    g._cells.forEach(c => { c._front.textContent = ' '; });
  });
  rowEls.forEach(({chip}) => {
    chip._front.style.backgroundColor = '';
    chip._back.style.backgroundColor = '';
  });
  await new Promise(r => setTimeout(r, 250));
  runSequence();
}

document.getElementById('replay').addEventListener('click', resetBoard);
document.getElementById('upload').addEventListener('click', () => {
  document.getElementById('upload-input').click();
});

// ---- Upload modal: read -> verify -> parse -> refresh board ----

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function readFileWithProgress(file, onProgress){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onprogress = (e) => { if (e.lengthComputable) onProgress((e.loaded / e.total) * 100); };
    reader.onerror = () => reject(reader.error);
    reader.onload = () => resolve(reader.result);
    reader.readAsArrayBuffer(file);
  });
}

function parseMazeReport(fullText){
  // OCR frequently misreads a capital "I" standing alone as a pipe character
  // ("I found the dashboard..." -> "| found the dashboard..."), which would
  // otherwise silently break the exact-phrase question matches below.
  const norm = fullText.replace(/\r/g, '').replace(/(^|\s)\|(?=\s)/g, '$1I');
  const result = { title:null, responses:null, blocks:null, metrics:[], scaleResults:[], openTotal:0, openAnswered:0 };

  // The report's own title (e.g. "Privacy KPI Cards") sits on its own line
  // right after the "Maze version - <study type>" line. Its words are either
  // ALL CAPS (an acronym like "KPI"), Capitalized, a number, or a short
  // lowercase connector ("of", "vs", ...), whereas the decorative background
  // artwork next to it OCRs as arbitrary lowercase noise fragments — so
  // keeping only the leading run of words that fit one of those patterns
  // drops the noise without truncating a real multi-word title early.
  const TITLE_CONNECTORS = new Set(['OF','AND','THE','FOR','IN','ON','TO','VS','VS.','A','AN','&']);
  const titleLineMatch = norm.match(/Maze version\s*-\s*[^\n]*\n+([^\n]+)/i);
  if (titleLineMatch){
    const words = titleLineMatch[1].trim().split(/\s+/);
    const kept = [];
    for (const w of words){
      const isAcronym = /^[A-Z]+$/.test(w);
      const isCapitalized = /^[A-Z][a-z]+$/.test(w);
      const isNumber = /^\d+$/.test(w);
      const isConnector = TITLE_CONNECTORS.has(w.toUpperCase().replace(/\.$/, ''));
      if (isAcronym || isCapitalized || isNumber || isConnector) kept.push(w);
      else break;
    }
    // A trailing connector word means the run ended on a mid-title word that
    // happened to look like noise (or the line legitimately trails off) —
    // drop it rather than keep a title that ends on "of" or "and".
    while (kept.length && TITLE_CONNECTORS.has(kept[kept.length - 1].toUpperCase().replace(/\.$/, ''))){
      kept.pop();
    }
    if (kept.length) result.title = kept.join(' ').toUpperCase();
  }

  // The KPI header reads (OCR'd) as "Responses # of blocks ... 2 15 ... See
  // online report" — both label words land together, then both values land
  // together further along, before the "See online report" button text.
  const headerIdx = norm.search(/Responses[\s\S]{0,40}?#?\s*of\s*blocks/i);
  if (headerIdx !== -1){
    let windowText = norm.slice(headerIdx, headerIdx + 300);
    const boundary = windowText.search(/see online report/i);
    if (boundary !== -1) windowText = windowText.slice(0, boundary);
    const nums = (windowText.match(/\b\d{1,4}\b/g) || []).map(n => parseInt(n, 10));
    if (nums.length >= 1) result.responses = nums[0];
    if (nums.length >= 2) result.blocks = nums[1];
  }

  const metricRowRe = /(\d{1,2})\s*[·.\-]\s*([A-Za-z][A-Za-z ,/&-]+?)\s+(\d{1,3})%/g;
  let m;
  while ((m = metricRowRe.exec(norm))){
    result.metrics.push({ rank:+m[1], label:m[2].trim(), pct:+m[3] });
  }

  // Dynamically detect every Likert/scale question in the report by finding
  // clusters of exactly 5 percentage values that sum to ~100% (the signature
  // of a 1–5 opinion-scale bucket distribution).  For each cluster the question
  // text is taken from the nearest sentence-like line in the preceding 600 chars.
  // This works for any Maze report regardless of which specific questions were asked.
  const fivePctRe = /(\d{1,3})%\s+(\d{1,3})%\s+(\d{1,3})%\s+(\d{1,3})%\s+(\d{1,3})%/g;
  const usedPctIdx = [];
  let pm;
  while ((pm = fivePctRe.exec(norm)) !== null){
    const vals = [+pm[1], +pm[2], +pm[3], +pm[4], +pm[5]];
    const sum = vals.reduce((a,b) => a+b, 0);
    if (sum < 75 || sum > 125) continue; // not a scale distribution
    if (usedPctIdx.some(ui => Math.abs(ui - pm.index) < 250)) continue; // dedup
    usedPctIdx.push(pm.index);
    const lookback = norm.slice(Math.max(0, pm.index - 600), pm.index);
    const lines = lookback.split('\n').map(l => l.trim()).filter(l => l.length > 15);
    // Prefer the most-recent line that reads as a question or statement sentence
    const qLine = [...lines].reverse().find(l =>
      /[?.!]$/.test(l) || /^[A-Z][a-z]/.test(l) || /^I\s/i.test(l)
    ) || lines[lines.length - 1] || '';
    if (!qLine) continue;
    const weighted = vals.reduce((s,v,i) => s + (i+1)*v, 0) / 100;
    result.scaleResults.push({
      label: qLine,
      score: Math.round(weighted * 10) / 10,
      buckets: vals,
    });
  }

  const openBlocks = norm.split(/Open Question/i).slice(1);
  result.openTotal = openBlocks.length;
  result.openAnswered = openBlocks.filter(b => !/No data to display yet/i.test(b.slice(0, 300))).length;

  return result;
}

function buildDataFromParsed(parsed){
  const total = parsed.responses ?? 2;

  // Strip grammatical/filler words to generate concise board labels from
  // long question sentences (e.g. "I found the dashboard unnecessarily complex." → "FOUND DASHBOARD COMPLEX")
  const STOP = new Set(['a','an','the','is','are','was','were','be','been','have','has',
    'do','does','did','will','would','shall','should','may','might','can','could',
    'i','me','my','we','our','you','your','it','its','this','that','these','those',
    'to','for','of','in','on','at','by','with','from','or','and','but','not',
    'how','what','when','where','who','which','why','up','make','us','am','also']);
  function shortLabel(text){
    const words = text.replace(/[?.!'"]/g,'').split(/\s+/);
    const sig = words.filter(w => !STOP.has(w.toLowerCase()) && /^[A-Za-z]{2,}$/.test(w));
    return sig.join(' ').toUpperCase().slice(0, 22);
  }

  const candidates = [];
  const votesFor = (pct) => `${Math.round((pct/100)*total)}/${total}`;
  const statusForPct   = (pct) => pct >= 90 ? 'ON TIME' : pct >= 40 ? 'BOARDING' : 'DELAYED';
  const statusForScale = (v)   => v >= 4    ? 'ON TIME' : v >= 3    ? 'BOARDING' : 'DELAYED';
  const statusForNeg   = (v)   => v <= 2    ? 'ON TIME' : v <= 3    ? 'BOARDING' : 'DELAYED';

  // Task-completion metrics (numbered rows with a percentage, e.g. "1. On-time completion 83%")
  for (const m of parsed.metrics){
    candidates.push({
      type:'task', completeness: m.pct,
      metric: m.label.toUpperCase().slice(0, 22),
      votes: votesFor(m.pct),
      score: `${m.pct}%`,
      status: statusForPct(m.pct),
    });
  }

  // Likert / opinion-scale questions (dynamically detected — any question type)
  for (const sq of (parsed.scaleResults || [])){
    const label = shortLabel(sq.label);
    if (!label) continue;
    // "Negative" framing questions (complexity, difficulty, confusion) score
    // inversely — a low scale score means the dashboard IS easy / non-complex.
    const isNegative = /complex|difficult|confus|frustrat/i.test(sq.label);
    candidates.push({
      type:'scale', completeness: Math.abs(sq.score - 3.0), // extremity from neutral
      metric: label,
      votes: '1/1',
      score: `${sq.score}/5`,
      status: isNegative ? statusForNeg(sq.score) : statusForScale(sq.score),
    });
  }

  // Open-question summary (one aggregate row)
  if (parsed.openTotal > 0){
    const openStatus = parsed.openAnswered === 0 ? 'CANCELLED'
      : parsed.openAnswered < parsed.openTotal ? 'BOARDING' : 'ON TIME';
    candidates.push({
      type:'open', completeness: parsed.openAnswered / Math.max(1, parsed.openTotal),
      metric: 'OPEN INSIGHTS',
      votes: `${parsed.openAnswered}/${parsed.openTotal}`,
      score: `${parsed.openAnswered}/${parsed.openTotal}`,
      status: openStatus,
    });
  }

  // Rank: task metrics first (by completion %), then scale questions (by how
  // decisive/extreme the score is), then open questions — so the board always
  // leads with the most data-rich and visually interesting statistics.
  const typePriority = { task:0, scale:1, open:2 };
  candidates.sort((a,b) =>
    typePriority[a.type] !== typePriority[b.type]
      ? typePriority[a.type] - typePriority[b.type]
      : b.completeness - a.completeness
  );

  // Exactly 8 rows — pad with blank CANCELLED rows if the report had fewer
  const top8 = candidates.slice(0, 8);
  while (top8.length < 8){
    top8.push({ metric:'--', votes:'--', score:'--', status:'CANCELLED' });
  }

  return top8.map(({ metric, votes, score, status }) => ({ metric, votes, score, status }));
}

const modalOverlay = document.getElementById('modal-overlay');
const modalCloseBtn = document.getElementById('modal-close');
const modalContinueBtn = document.getElementById('modal-continue');
const modalMessageEl = document.getElementById('modal-message');
const uploadInput = document.getElementById('upload-input');

const pctGroups = {
  uploading: buildFlapGroup('  0%', 'pct'),
  verifying: buildFlapGroup('  0%', 'pct'),
  parsing:   buildFlapGroup('  0%', 'pct'),
};
document.getElementById('pct-uploading').appendChild(pctGroups.uploading);
document.getElementById('pct-verifying').appendChild(pctGroups.verifying);
document.getElementById('pct-parsing').appendChild(pctGroups.parsing);

const modalRowEls = {
  uploading: document.getElementById('row-uploading'),
  verifying: document.getElementById('row-verifying'),
  parsing:   document.getElementById('row-parsing'),
};

let uploadToken = 0;
let pendingUpdate = null;
let activeWorker = null;

// Maze exports these reports as fully rendered page images with no real text
// layer (confirmed empirically: pdf.js returns zero text items on every page
// of a real export), so text can only be recovered by rendering each page to
// a canvas and running OCR over the pixels.
//
// The report's highlighted rows/cells (selected metrics, the selected opinion
// score) sit on a saturated teal/green fill rather than plain white, and
// Tesseract's default binarization loses the text there entirely. The actual
// text is near-black on every fill color used in this template, so a plain
// luminance threshold (independent of hue) recovers it reliably.
function binarize(canvas, threshold){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4){
    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const v = gray < threshold ? 0 : 255;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

async function renderPageToCanvas(pdf, pageNum, scale){
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return binarize(canvas, 100);
}

async function ocrPage(worker, pdf, pageNum, scale){
  const canvas = await renderPageToCanvas(pdf, pageNum, scale);
  const { data } = await worker.recognize(canvas);
  return data.text || '';
}

function setRowState(stage, state){
  const el = modalRowEls[stage];
  el.classList.remove('active', 'done', 'error');
  if (state) el.classList.add(state);
}

function resetModalState(){
  ['uploading', 'verifying', 'parsing'].forEach(stage => {
    setGroupPercent(pctGroups[stage], 0);
    setRowState(stage, null);
    pctGroups[stage].classList.remove('pct-error');
  });
  modalMessageEl.textContent = '';
  modalContinueBtn.disabled = true;
  pendingUpdate = null;
}

function openModal(){ modalOverlay.classList.add('open'); }
function closeModal(){
  modalOverlay.classList.remove('open');
  uploadInput.value = '';
  uploadToken++; // invalidate any pipeline still in flight
  if (activeWorker){
    activeWorker.terminate();
    activeWorker = null;
  }
}

function failModal(stage, message, token){
  if (token !== uploadToken) return;
  setRowState(stage, 'error');
  pctGroups[stage].classList.add('pct-error');
  modalMessageEl.textContent = message;
}

async function handleFileSelected(file){
  const token = ++uploadToken;
  resetModalState();
  openModal();
  setRowState('uploading', 'active');

  let arrayBuffer;
  try {
    arrayBuffer = await readFileWithProgress(file, pct => {
      if (token !== uploadToken) return;
      setGroupPercent(pctGroups.uploading, pct);
    });
  } catch (err) {
    failModal('uploading', 'Could not read the selected file.', token);
    return;
  }
  if (token !== uploadToken) return;
  setGroupPercent(pctGroups.uploading, 100);
  setRowState('uploading', 'done');

  setRowState('verifying', 'active');
  let pdf;
  try {
    pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  } catch (err) {
    failModal('verifying', "This doesn't look like a valid PDF file.", token);
    return;
  }
  if (token !== uploadToken) return;

  let worker;
  try {
    worker = await Tesseract.createWorker('eng');
    activeWorker = worker;
  } catch (err) {
    failModal('verifying', "Couldn't start the OCR engine. Check your connection and try again.", token);
    return;
  }
  if (token !== uploadToken){ worker.terminate(); return; }
  setGroupPercent(pctGroups.verifying, 15); // OCR engine warmed up

  const OCR_SCALE = 2;
  let page1Text;
  try {
    page1Text = await ocrPage(worker, pdf, 1, OCR_SCALE);
  } catch (err) {
    failModal('verifying', 'Could not read the PDF pages.', token);
    worker.terminate(); activeWorker = null;
    return;
  }
  if (token !== uploadToken){ worker.terminate(); return; }
  setGroupPercent(pctGroups.verifying, 100);

  const looksLikeMazeReport = /maze/i.test(page1Text) &&
    (/responses/i.test(page1Text) || /#?\s*of blocks/i.test(page1Text));

  if (!looksLikeMazeReport){
    failModal('verifying', "This doesn't look like a MAZE report PDF.", token);
    worker.terminate(); activeWorker = null;
    return;
  }
  setRowState('verifying', 'done');

  setRowState('parsing', 'active');
  let fullText = page1Text + '\n';
  for (let p = 2; p <= pdf.numPages; p++){
    if (token !== uploadToken){ worker.terminate(); return; }
    try {
      fullText += (await ocrPage(worker, pdf, p, OCR_SCALE)) + '\n';
    } catch (err) {
      // Skip a page OCR couldn't read rather than failing the whole parse.
    }
    setGroupPercent(pctGroups.parsing, ((p - 1) / (pdf.numPages - 1)) * 100);
  }

  worker.terminate();
  activeWorker = null;
  if (token !== uploadToken) return;

  const parsed = parseMazeReport(fullText);
  const newRows = buildDataFromParsed(parsed);
  setGroupPercent(pctGroups.parsing, 100);
  setRowState('parsing', 'done');

  pendingUpdate = { rows:newRows, responses:parsed.responses, title:parsed.title };
  modalContinueBtn.disabled = false;
}

function applyNewData(update){
  update.rows.forEach((row, i) => { DATA[i] = row; });
  if (update.responses != null){
    document.querySelector('.nameplate > span').textContent =
      `MODEL SF·24  ·  SOURCE: MAZE REPORT  ·  N = ${update.responses} RESPONDENTS`;
  }
  if (update.title){
    HERO_TITLE = update.title;
    rebuildHeroGroup(HERO_TITLE);
  }
  resetBoard();
}

uploadInput.addEventListener('change', () => {
  const file = uploadInput.files && uploadInput.files[0];
  if (file) handleFileSelected(file);
});
modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
});
modalContinueBtn.addEventListener('click', () => {
  if (pendingUpdate) applyNewData(pendingUpdate);
  closeModal();
});

runSequence();
</script>
